name: Docker Compose CI

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start containers with Docker Compose
        # Собираем образы и запускаем оба контейнера в фоне
        run: docker compose up -d --build

      - name: Wait for services to be ready
        # Ждем 10 секунд, чтобы PostgreSQL успел инициализироваться
        run: sleep 10

      - name: Test API endpoint
        # Делаем запрос к нашему API. Если он вернет ошибку (не 200), пайплайн упадет.
        run: |
          curl -f http://localhost:5000/items || exit 1

      - name: Stop containers
        # Останавливаем контейнеры в любом случае (даже если тест упал), чтобы не тратить ресурсы GitHub
        if: always()
        run: docker compose down
